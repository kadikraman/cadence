name: Start the agent

on:
  issues:
    types: [labeled]

jobs:
  start:
    if: github.event.label.name == 'agent'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cadence
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: npx --yes eas-cli@latest workflow:run .eas/workflows/issue-to-pr.yml --ref ${{ github.sha }} -F issue_number=${{ github.event.issue.number }} --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
